name: Advisory site reports
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advisory-site-reports
  cancel-in-progress: false
jobs:
  external-links:
    name: External links and media (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-translation.txt}
      - run: python -m pip install -r requirements-translation.txt
      - run: python scripts/report-external-links.py
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: external-link-report, path: reports/, if-no-files-found: ignore, retention-days: 30}
  performance-accessibility:
    name: Mobile Lighthouse and accessibility (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - name: Create reports
        shell: bash
        run: |
          node tests/support/static-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep 1; done
          node scripts/report-accessibility.mjs
          CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')" node scripts/report-lighthouse.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: performance-accessibility-report, path: reports/, if-no-files-found: ignore, retention-days: 30}
