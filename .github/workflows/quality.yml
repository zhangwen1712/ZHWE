name: Blog quality checks

on:
  pull_request:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, tests, and translation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-translation.txt
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check translation coverage
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            python scripts/check-translation-coverage.py --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/check-translation-coverage.py --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify generated translations are current
        run: |
          python scripts/generate-locales.py
          python scripts/generate-traditional.py
          git diff --exit-code -- 'translations/*-content.json'
      - name: Build Cloudflare Pages preview
        run: npm run build:pages
      - name: Run JavaScript tests
        run: npm test
      - name: Run translation coverage tests
        run: python -m unittest discover -s test -p '*_test.py'
      - name: Check dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
