name: Blog quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  build-content:
    name: Build, content and site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version-file: .node-version, cache: npm}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-translation.txt}
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-translation.txt
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Compare published content with base
        run: python scripts/check-content-integrity.py
      - name: Build Cloudflare Pages preview
        run: npm run build:pages
      - name: Check local links, SEO and preview policy
        run: python scripts/check-site-integrity.py
      - name: Run JavaScript tests
        run: npm test

  translations:
    name: Translation coverage and page readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-translation.txt}
      - run: python -m pip install -r requirements-translation.txt
      - name: Check translation coverage
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            python scripts/check-translation-coverage.py --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/check-translation-coverage.py --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report page readiness and verify fallback
        run: python scripts/report-page-translations.py
      - name: Verify generated translation data
        run: |
          python scripts/generate-locales.py
          python scripts/generate-traditional.py
          git diff --exit-code -- 'translations/*-content.json'
      - name: Run translation rule tests
        run: python -m unittest discover -s test -p '*_test.py'

  mobile:
    name: Mobile browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - run: npm run test:browser
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v6
        with: {name: mobile-browser-report, path: playwright-report/, if-no-files-found: ignore, retention-days: 7}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@v4
        with: {fail-on-severity: high}

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=high
